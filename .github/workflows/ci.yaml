name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: >
          sudo apt-get update -y && sudo apt-get install -y
          libglib2.0-0 libegl1 libgl1 libfontconfig1
          libqt6core6 libqt6gui6 libqt6widgets6 libqt6network6 libqt6xml6
          libdbus-1-3 libxkbcommon0 libopengl0
          libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          if ! uv sync --locked --dev 2>/dev/null; then
            echo "Lock file out of date, running uv lock..."
            uv lock
            uv sync --dev
          fi

      - name: Run ruff format
        run: uv run ruff format --check

      - name: Run ruff check
        run: uv run ruff check --output-format=github

      - name: Run mypy
        run: uv run mypy mdcx/

      - name: Run pytest
        # PyQt6 需要 display 才能实例化 QApplication；offscreen 平台无需 X11/Wayland
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ --tb=short -m "not network"

      - name: Run check_actor_db
        run: uv run python -m scripts.check_actor_db

      - name: Run check_info_db
        run: uv run python -m scripts.check_info_db

      - name: Run check_thread_safety
        run: uv run python -m scripts.check_thread_safety

      - name: Run check_ui_layout
        run: uv run python -m scripts.check_ui_layout

  windows:
    name: Windows Compatibility and Build
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true

      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --locked --all-extras --dev

      - name: Run Windows offline tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: uv run pytest tests/ --tb=short -m "not network"
