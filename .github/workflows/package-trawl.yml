name: Package TRAWL Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'TRAWL 版本 (如 1.4.0)'
        required: true
        default: '1.4.0'
      upload_to_releases:
        description: '上传到 GitHub Releases'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    name: Package for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone TRAWL
        shell: bash
        run: |
          git clone --depth 1 --branch v${{ inputs.version }} https://github.com/germondai/trawl.git trawl-src
          cd trawl-src
          bun --version

      - name: Install Dependencies
        working-directory: trawl-src
        shell: bash
        run: bun install --frozen-lockfile

      - name: Cache Camoufox Browser
        id: cache-camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-${{ inputs.version }}
          restore-keys: |
            ${{ runner.os }}-camoufox-

      - name: Download Camoufox (if not cached)
        if: steps.cache-camoufox.outputs.cache-hit != 'true'
        working-directory: trawl-src
        shell: bash
        run: |
          echo "下载 Camoufox Firefox (~663MB)，请稍候..."
          bunx camoufox-js fetch
          echo "下载完成"

      - name: Create Portable Package
        shell: bash
        run: |
          PACKAGE="trawl-portable-${{ inputs.version }}-windows"
          mkdir -p "$PACKAGE"
          
          # 复制 trawl 源码和配置
          cp -r trawl-src/* "$PACKAGE/"
          cp trawl-src/.env.example "$PACKAGE/.env"
          
          # 复制启动脚本
          cp scripts/windows/start-trawl.bat "$PACKAGE/"
          cp scripts/windows/download-bun.bat "$PACKAGE/"
          cp scripts/windows/README.md "$PACKAGE/"
          
          # 打包 Bun 运行时
          BUN_VERSION=$(bun --version)
          echo "下载 Bun $BUN_VERSION ..."
          Bun_url="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-windows-x64.zip"
          curl -sL "$Bun_url" -o bun.zip
          mkdir -p "$PACKAGE/bun"
          Expand-Archive -Path bun.zip -DestinationPath "$PACKAGE/bun" -Force
          rm bun.zip
          
          # 复制缓存的 Camoufox
          if [ -d "$HOME/.cache/camoufox" ]; then
            mkdir -p "$PACKAGE/.cache"
            cp -r "$HOME/.cache/camoufox" "$PACKAGE/.cache/"
            echo "已包含 Camoufox 缓存"
          fi
          
          echo "打包完成，大小:"
          du -sh "$PACKAGE"

      - name: Create ZIP
        shell: bash
        run: |
          PACKAGE="trawl-portable-${{ inputs.version }}-windows"
          Compress-Archive -Path "$PACKAGE/*" -DestinationPath "${PACKAGE}.zip" -Force
          ls -lh "${PACKAGE}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trawl-portable-${{ inputs.version }}-windows
          path: trawl-portable-${{ inputs.version }}-windows.zip
          retention-days: 7

      - name: Create GitHub Release
        if: inputs.upload_to_releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trawl-${{ inputs.version }}
          name: TRAWL ${{ inputs.version }} Windows Portable
          files: trawl-portable-${{ inputs.version }}-windows.zip
          draft: false
          prerelease: false
          body: |
            ## TRAWL ${{ inputs.version }} Windows 便携版
            
            基于 [germondai/trawl](https://github.com/germondai/trawl) 的 Windows 便携打包。
            
            ### 功能
            - 绕过 Cloudflare Bot Management
            - 支持 Akamai、Imperva WAF  
            - FlareSolverr 兼容 API (`/v1`)
            - Camoufox 浏览器集成（Firefox 内核）
            
            ### 使用方法
            1. 解压到任意目录（如 `C:\Tools\trawl`）
            2. 双击 `start-trawl.bat` 启动
            3. 等待浏览器预热 (约 1-2 分钟)
            4. 配置 MDCx: 设置 → 网络 → CF Bypass 地址填 `http://localhost:8191/v1`
            
            ### 系统要求
            - Windows 10/11 (x64)
            - 2GB RAM 可用内存
            - 1GB 磁盘空间
            
            ### 故障排查
            - 启动失败：运行 `download-bun.bat` 重新下载 Bun
            - 端口冲突：编辑 `.env`，修改 `PORT=8191`
            - 浏览器慢：首次需下载 Camoufox (~663MB)
            
            ---
            原版项目: https://github.com/germondai/trawl
            许可: AGPL-3.0
